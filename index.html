    <!-- CLOUD-SYNC (1/2): registreer lokale wijzigingen. Draait vóór de app, zodat geen enkele
         wijziging gemist wordt. Alleen deze sleutels gaan de cloud in; caches/vlaggen blijven lokaal. -->
    <script>
        (function () {
            window.SYNC_KEYS = [
                'dashboard_manual_shifts', 'sobriety_history', 'arm_history', 'minox_start_date',
                'dashboard_roster_overrides', 'amber_shifts', 'dashboard_loonstrook'
            ];
            try {
                if (!localStorage.getItem('_sync_client_id')) {
                    localStorage.setItem('_sync_client_id',
                        'c-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
                }
            } catch (e) {}
            window.__applyingRemote = false;      // true terwijl cloud-data lokaal wordt toegepast
            window.__reloading = false;           // true zodra we gaan herladen (blokkeert pushes)
            window.__syncPending = false;         // er was een wijziging vóór de sync-module klaar was
            // Tot deel 2/2 klaar is: wijzigingen niet laten vallen, maar onthouden.
            window.__syncRequestPush = function () { window.__syncPending = true; };
            var origSet = localStorage.setItem.bind(localStorage);
            localStorage.setItem = function (key, value) {
                origSet(key, value);
                if (!window.__applyingRemote && !window.__reloading && window.SYNC_KEYS.indexOf(key) !== -1) {
                    try { window.__syncRequestPush(); } catch (e) {}
                }
            };
        })();
    </script>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import {

        const App = () => {
            const [currentDate, setCurrentDate] = useState(new Date());
            // Loonstrookcontroles: op de pc uit loonstrook-data.js, op de telefoon uit de cloud-sync (dashboard_loonstrook)
            const loonChecks = (window.LOONSTROOK_DATA && window.LOONSTROOK_DATA.checks) || (() => {
                try { const v = JSON.parse(localStorage.getItem('dashboard_loonstrook') || 'null'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
            })();
            const loonLaatste = loonChecks.length
                ? [...loonChecks].sort((a, b) => (a.jaar * 100 + a.periode) - (b.jaar * 100 + b.periode))[loonChecks.length - 1]
                : null;
            const [viewDate, setViewDate] = useState(new Date());

            // --- HELPER VOOR DATUM FORMATTERING (LOKAAL) ---
            const toLocalISOString = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            // --- SOBRIETY STATE MET HISTORIE ---
            const [sobrietyHistory, setSobrietyHistory] = useState(() => {
                const savedHistory = localStorage.getItem('sobriety_history');
                if (savedHistory) {
                    return JSON.parse(savedHistory).map(p => ({
                        start: new Date(p.start),
                        end: p.end ? new Date(p.end) : null
                    }));
                }
                const oldSavedDate = localStorage.getItem('sobriety_start_date');
                // Neutrale default (privacy): jouw echte startdatum komt uit je JSON-bestand / localStorage
                const defaultDate = new Date();
                return [{ start: oldSavedDate ? new Date(oldSavedDate) : defaultDate, end: null }];
            });

            const [daysSoberToday, setDaysSoberToday] = useState(0);
            const [showSoberSettingsModal, setShowSoberSettingsModal] = useState(false);
            const activeSoberPeriod = sobrietyHistory[sobrietyHistory.length - 1];
            const [newSoberStartDate, setNewSoberStartDate] = useState(toLocalISOString(activeSoberPeriod.start));

            // --- ARM TRAINING STATE MET HISTORIE & CYCLUS ---
            const [armHistory, setArmHistory] = useState(() => {
                const savedHistory = localStorage.getItem('arm_history');
                if (savedHistory) {
                    return JSON.parse(savedHistory).map(p => ({
                        start: new Date(p.start),
                        end: p.end ? new Date(p.end) : null,
                        cycle: p.cycle || 3
                    }));
                }
                const oldSavedDate = localStorage.getItem('arm_start_date');
                // Neutrale default (privacy): jouw echte startdatum komt uit je JSON-bestand / localStorage
                const defaultDate = new Date();
                return [{ start: oldSavedDate ? new Date(oldSavedDate) : defaultDate, end: null, cycle: 3 }];
            });

            const [armStatus, setArmStatus] = useState("");
            const [showArmSettingsModal, setShowArmSettingsModal] = useState(false);
            const activeArmPeriod = armHistory[armHistory.length - 1];
            const [newArmStartDate, setNewArmStartDate] = useState(toLocalISOString(activeArmPeriod.start));
            const [newArmCycle, setNewArmCycle] = useState(activeArmPeriod.cycle || 3);

            // --- MINOXIDIL STATE ---
            const [minoxStartDate, setMinoxStartDate] = useState(() => {
                const savedDate = localStorage.getItem('minox_start_date');
                // Neutrale default (privacy): jouw echte startdatum komt uit je JSON-bestand / localStorage
                return savedDate ? new Date(savedDate) : new Date();
            });
            const [minoxDisplay, setMinoxDisplay] = useState("");
            const [showMinoxSettingsModal, setShowMinoxSettingsModal] = useState(false);
            const [newMinoxStartDateInput, setNewMinoxStartDateInput] = useState(toLocalISOString(minoxStartDate));
            
            // DATA
            const [rosterShifts, setRosterShifts] = useState({});
            const [manualShifts, setManualShifts] = useState({});
            // Correcties op automatische roosterdiensten, per UID: verbergen of tijden/omschrijving aanpassen.
            // Ligt als een laag bovenop het gesynchroniseerde rooster, zodat een sync ze niet overschrijft.
            const [rosterOverrides, setRosterOverrides] = useState(() => {
                try { const s = localStorage.getItem('dashboard_roster_overrides'); return s ? JSON.parse(s) : {}; }
                catch (e) { return {}; }
            });
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [editShift, setEditShift] = useState(null);

            // STATES
            const [loadingShifts, setLoadingShifts] = useState(false);
            const [showAddModal, setShowAddModal] = useState(false);
            const [selectedDate, setSelectedDate] = useState(null);
            const [newNote, setNewNote] = useState("");
            const [newEntryType, setNewEntryType] = useState('note');      // 'note' of 'vakantie'
            const [vakantieTotEnMet, setVakantieTotEnMet] = useState("");

            // AMBER ROOSTER STATES
            const [amberShifts, setAmberShifts] = useState(() => {
                const saved = localStorage.getItem('amber_shifts');
                return saved ? JSON.parse(saved) : {};
            });
            const [showAmberModal, setShowAmberModal] = useState(false);
            const [amberMonth, setAmberMonth] = useState(new Date().getMonth());
            const [amberYear, setAmberYear] = useState(new Date().getFullYear());
            const [amberBulkInput, setAmberBulkInput] = useState("");
            const [amberBulkParsed, setAmberBulkParsed] = useState([]);
            const [amberAnalyzing, setAmberAnalyzing] = useState(false);
            const [amberAnalyzeError, setAmberAnalyzeError] = useState(null);

            // KALENDER FILTER STATES
            const [showFilters, setShowFilters] = useState(false);
            const [calendarFilters, setCalendarFilters] = useState(() => {
                const saved = localStorage.getItem('calendar_filters');
                const defaults = {
                    showSwimming: true,
                    showTraining: true,
                    showSobriety: true,
                    showAmber: true,
                    showWork: true,
                    showNotes: true,
                    showVakantie: true,
                    showSalary: true,
                    showTrigion: true
                };
                if (saved) {
                    const parsed = JSON.parse(saved);
                    return { ...defaults, ...parsed };
                }
                return defaults;
            }); 

            // CONFIGURATIE VAST
            // Werkrooster komt uit RostarCAS (Trigion Schiphol). De privé feed-URL staat
            // BEWUST NIET in deze client-code: een GitHub Action haalt de feed server-side
            // op en schrijft het resultaat naar ./schedule.ics naast dit dashboard.
            const poolScheduleUrl = "https://victoriabad.nl/tijden-en-tarieven/";
            
            const poolSchedule = {
                0: { times: ["09:30 - 14:00"], label: "Zondag", isOpen: true },
                1: { times: [], label: "Maandag", isOpen: false },
                2: { times: ["10:00 - 13:00", "19:30 - 21:00"], label: "Dinsdag", isOpen: true },
                3: { times: ["09:00 - 13:00", "19:00 - 21:00"], label: "Woensdag", isOpen: true },
                4: { times: ["10:00 - 13:00"], label: "Donderdag", isOpen: true },
                5: { times: ["09:00 - 13:00"], label: "Vrijdag", isOpen: true },
                6: { times: ["09:00 - 13:00"], label: "Zaterdag", isOpen: true }
            };

            // SALARISDAGEN G4S (t/m juni 2026)
            const salaryDays = {
                '2026-01-28': { periode: 1, jaar: 2026 },
                '2026-02-25': { periode: 2, jaar: 2026 },
                '2026-03-25': { periode: 3, jaar: 2026 },
                '2026-04-22': { periode: 4, jaar: 2026, note: 'Vak' },
                '2026-05-20': { periode: 5, jaar: 2026 },
                '2026-06-17': { periode: 6, jaar: 2026 },
            };

            // BETAALDAGEN TRIGION (vanaf juni 2026, vrijdagen)
            const trigionDays = {
                '2026-06-19': { periode: 6, jaar: 2026 },
                '2026-07-17': { periode: 7, jaar: 2026 },
                '2026-08-14': { periode: 8, jaar: 2026 },
                '2026-09-11': { periode: 9, jaar: 2026 },
                '2026-10-09': { periode: 10, jaar: 2026 },
                '2026-11-06': { periode: 11, jaar: 2026 },
                '2026-12-04': { periode: 12, jaar: 2026 },
                '2027-01-08': { periode: 13, jaar: 2026 },
                '2027-02-05': { periode: 1, jaar: 2027 },
                '2027-03-05': { periode: 2, jaar: 2027 },
                '2027-04-02': { periode: 3, jaar: 2027 },
            };

            // Helper: Calculate days sober for a specific date based on history
            const getDaySoberCount = (dateToCheck) => {
                const checkTime = dateToCheck.getTime();
                for (const period of sobrietyHistory) {
                    const startTime = period.start.getTime();
                    const endTime = period.end ? period.end.getTime() : Infinity;
                    if (checkTime >= startTime && checkTime <= endTime) {
                        const diffTime = checkTime - startTime;
                        const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                        return days + 1; 
                    }
                }
                return 0;
            };

            // Helper: Check if a date is an Arm Training day based on history
            const isArmTrainingDay = (dateToCheck) => {
                const checkTime = dateToCheck.getTime();
                for (const period of armHistory) {
                    const startTime = period.start.getTime();
                    const endTime = period.end ? period.end.getTime() : Infinity;
                    const cycleLen = period.cycle || 3; 
                    
                    if (checkTime >= startTime && checkTime <= endTime) {
                        const diffTime = Math.floor((checkTime - startTime) / (1000 * 60 * 60 * 24));
                        if (diffTime >= 0 && diffTime % cycleLen === 0) {
                            return true;
                        }
                    }
                }
                return false;
            };

            // Helper: Bereken de LAATSTE trainingsdag op basis van het huidige schema
            const getLastScheduledArmDate = () => {
                const currentPeriod = armHistory[armHistory.length - 1];
                const startDate = currentPeriod.start;
                const cycleLen = currentPeriod.cycle || 3;
                const now = new Date();
                const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                
                const diffTime = startOfToday.getTime() - startDate.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays < 0) return startDate; 
                
                const daysSinceTraining = diffDays % cycleLen;
                
                const lastTrainingDate = new Date(startOfToday);
                lastTrainingDate.setDate(startOfToday.getDate() - daysSinceTraining);
                
                return lastTrainingDate;
            };

            const openArmSettings = () => {
                const lastDate = getLastScheduledArmDate();
                setNewArmStartDate(toLocalISOString(lastDate));
                setNewArmCycle(activeArmPeriod.cycle || 3);
                setShowArmSettingsModal(true);
            };

            useEffect(() => {
                const now = new Date();
                const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                
                // 1. Sobriety Calculation
                const currentSoberStreak = sobrietyHistory[sobrietyHistory.length - 1];
                if (currentSoberStreak) {
                    const diffTime = startOfToday - currentSoberStreak.start;
                    const days = diffTime >= 0 ? Math.floor(diffTime / (1000 * 60 * 60 * 24)) : 0;
                    setDaysSoberToday(days);
                }

                // 2. Arm Status
                const currentArmPeriod = armHistory[armHistory.length - 1];
                if (currentArmPeriod) {
                    const armStartDate = currentArmPeriod.start;
                    const cycleLen = currentArmPeriod.cycle || 3;
                    const diffArmTime = Math.floor((startOfToday.getTime() - armStartDate.getTime()) / (1000 * 60 * 60 * 24));
                    const dayInCycle = diffArmTime >= 0 ? diffArmTime % cycleLen : -1;
                    
                    if (diffArmTime < 0) {
                        setArmStatus("Start binnenkort");
                    } else if (dayInCycle === 0) {
                        setArmStatus("VANDAAG TRAINEN!");
                    } else {
                        const daysLeft = cycleLen - dayInCycle;
                        setArmStatus(`Rustdag (Nog ${daysLeft} dag${daysLeft > 1 ? 'en' : ''})`);
                    }
                }

                // 3. Minoxidil Calculation
                const diffMinox = Math.floor((startOfToday - minoxStartDate) / (1000 * 60 * 60 * 24));
                if (diffMinox >= 0) {
                    const weeks = Math.floor(diffMinox / 7);
                    const days = diffMinox % 7;
                    setMinoxDisplay(`${weeks} weken, ${days} dagen`);
                } else {
                    setMinoxDisplay("Start binnenkort");
                }

                // Save to local storage
                localStorage.setItem('sobriety_history', JSON.stringify(sobrietyHistory));
                localStorage.setItem('arm_history', JSON.stringify(armHistory));
                localStorage.setItem('minox_start_date', minoxStartDate.toISOString());

                const saved = localStorage.getItem('dashboard_manual_shifts');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (!localStorage.getItem('_vakantie_aug2026_injected')) {
                            const baseId = 1777830000000;
                            for (let d = 10; d <= 30; d++) {
                                const key = '2026-08-' + String(d).padStart(2, '0');
                                const entry = {id: baseId + d, summary: 'Vakantie', isManual: true, isNote: true};
                                if (!parsed[key]) parsed[key] = [];
                                if (!parsed[key].some(e => e.summary === 'Vakantie')) parsed[key].push(entry);
                            }
                            localStorage.setItem('dashboard_manual_shifts', JSON.stringify(parsed));
                            localStorage.setItem('_vakantie_aug2026_injected', '1');
                        }
                        if (!localStorage.getItem('_alleen_thuis_jul2026_injected')) {
                            const baseId2 = 1788830000000;
                            for (let d = 3; d <= 12; d++) {
                                if (d === 4) continue; // behalve 4 juli
                                const key = '2026-07-' + String(d).padStart(2, '0');
                                const entry = {id: baseId2 + d, summary: 'Alleen thuis', isManual: true, isNote: true};
                                if (!parsed[key]) parsed[key] = [];
                                if (!parsed[key].some(e => e.summary === 'Alleen thuis')) parsed[key].push(entry);
                            }
                            localStorage.setItem('dashboard_manual_shifts', JSON.stringify(parsed));
                            localStorage.setItem('_alleen_thuis_jul2026_injected', '1');
                        }
                        setManualShifts(parsed);
                    } catch (e) { console.error("Fout laden data", e); }
                }

                fetchAndParseICS();
            }, [sobrietyHistory, armHistory, minoxStartDate]);

            // Save Amber shifts to localStorage + auto-save
            useEffect(() => {
                localStorage.setItem('amber_shifts', JSON.stringify(amberShifts));
            }, [amberShifts]);

            // Save roster-correcties (verbergen/aanpassen van automatische diensten) to localStorage
            useEffect(() => {
                localStorage.setItem('dashboard_roster_overrides', JSON.stringify(rosterOverrides));
            }, [rosterOverrides]);

            // Save calendar filters to localStorage
            useEffect(() => {
                localStorage.setItem('calendar_filters', JSON.stringify(calendarFilters));
            }, [calendarFilters]);

            // --- SETTINGS HANDLERS ---
            const handleCorrectSoberDate = () => {
                const newDate = new Date(newSoberStartDate + "T00:00:00");
                if (isNaN(newDate)) return;
                const updatedHistory = [...sobrietyHistory];
                updatedHistory[updatedHistory.length - 1].start = newDate;
                setSobrietyHistory(updatedHistory);
                setShowSoberSettingsModal(false);
            };

            const handleRelapseSoberDate = () => {
                const newDate = new Date(newSoberStartDate + "T00:00:00");
                if (isNaN(newDate)) return;
                const updatedHistory = [...sobrietyHistory];
                const lastIdx = updatedHistory.length - 1;
                const prevEndDate = new Date(newDate);
                prevEndDate.setDate(prevEndDate.getDate() - 1);
                
                if (prevEndDate < updatedHistory[lastIdx].start) {
                    alert("De nieuwe startdatum moet na de vorige startdatum liggen.");
                    return;
                }
                updatedHistory[lastIdx].end = prevEndDate;
                updatedHistory.push({ start: newDate, end: null });
                setSobrietyHistory(updatedHistory);
                setShowSoberSettingsModal(false);
            };

            const handleCorrectArmDate = () => {
                const newDate = new Date(newArmStartDate + "T00:00:00");
                if (isNaN(newDate)) return;
                const updatedHistory = [...armHistory];
                const lastIdx = updatedHistory.length - 1;
                
                updatedHistory[lastIdx].start = newDate;
                updatedHistory[lastIdx].cycle = parseInt(newArmCycle);
                
                setArmHistory(updatedHistory);
                setShowArmSettingsModal(false);
            };

            const handleNewArmCycle = () => {
                const newDate = new Date(newArmStartDate + "T00:00:00");
                if (isNaN(newDate)) return;
                
                const updatedHistory = [...armHistory];
                const lastIdx = updatedHistory.length - 1;
                const lastScheduled = getLastScheduledArmDate();
                
                let prevEndDate;

                if (newDate > lastScheduled) {
                    prevEndDate = new Date(lastScheduled);
                    prevEndDate.setDate(prevEndDate.getDate() - 1);
                } else {
                    prevEndDate = new Date(newDate);
                    prevEndDate.setDate(prevEndDate.getDate() - 1);
                }

                if (prevEndDate < updatedHistory[lastIdx].start) {
                    updatedHistory[lastIdx].start = newDate;
                    updatedHistory[lastIdx].cycle = parseInt(newArmCycle);
                } else {
                    updatedHistory[lastIdx].end = prevEndDate;
                    updatedHistory.push({ start: newDate, end: null, cycle: parseInt(newArmCycle) });
                }

                setArmHistory(updatedHistory);
                setShowArmSettingsModal(false);
            };

            const handleMinoxDateChange = () => {
                const newDate = new Date(newMinoxStartDateInput + "T00:00:00");
                if (isNaN(newDate)) return;
                setMinoxStartDate(newDate);
                setShowMinoxSettingsModal(false);

            const saveData = (newShifts) => {
                setManualShifts(newShifts);
                localStorage.setItem('dashboard_manual_shifts', JSON.stringify(newShifts));

            // --- ROOSTER-CORRECTIES: automatische diensten verbergen of aanpassen ---
            // De correcties liggen als override-laag (per UID) bovenop het gesynchroniseerde
            // rooster, zodat een volgende sync ze niet overschrijft.
            const persistRosterOverrides = (next) => {
                setRosterOverrides(next);
                localStorage.setItem('dashboard_roster_overrides', JSON.stringify(next));
            };
            const handleHideRosterShift = (uid) => {
                if (!uid) return;

                persistRosterOverrides({ ...rosterOverrides, [uid]: { ...(rosterOverrides[uid] || {}), hidden: true } });
            };
            const restoreRosterShift = (uid) => {
                if (!uid) return;
                const next = { ...rosterOverrides };
                delete next[uid];
                persistRosterOverrides(next);

            const openEditShift = (dateKey, e) => {
                const hhmm = (d) => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                setEditShift({ uid: e.uid, dateKey, summary: cleanSummary(e.summary) || "", startTime: hhmm(e.sortStart), endTime: hhmm(e.sortEnd) });

            const saveEditShift = () => {

                const start = new Date(`${dateKey}T${startTime}:00`);
                let end = new Date(`${dateKey}T${endTime}:00`);
                if (end <= start) end = new Date(end.getTime() + 24 * 3600 * 1000); // nachtdienst: eind volgende dag
                persistRosterOverrides({ ...rosterOverrides, [uid]: { ...(rosterOverrides[uid] || {}), hidden: false, summary, startISO: start.toISOString(), endISO: end.toISOString() } });

            // --- KALENDER LOGICA ---
            const handleDeleteShift = (dateKey, id) => {
                const updatedShifts = { ...manualShifts };
                if (updatedShifts[dateKey]) {
                    updatedShifts[dateKey] = updatedShifts[dateKey].filter(s => s.id !== id);
                    if (updatedShifts[dateKey].length === 0) delete updatedShifts[dateKey];
                    saveData(updatedShifts);
                }
            };

            const cleanSummary = (summary) => {
                if (!summary) return "";
                const cleaned = summary.replace(/^\d{1,2}:\d{2}\s*[-–]\s*\d{1,2}:\d{2}\s*/, '').trim();
                if (cleaned.toLowerCase().includes('verlof naar rato')) return 'Verlof';
                return cleaned;
            };

            // Vakantie is een eigen dagtype met een eigen kleur (oranje) — geen losse notitie meer nodig.
            // Oude notities met precies de tekst "Vakantie" tellen automatisch ook mee.
            const isVakantieEntry = (e) => !!e && (e.isVakantie === true || /^\s*vakantie\s*$/i.test(e.summary || ''));

            const parseICS = (icsData) => {
                const events = {};
                const lines = icsData.split(/\r\n|\n|\r/);
                let currentEvent = null;

                const parseDate = (dateStr) => {
                    if (!dateStr) return null;
                    const clean = dateStr.trim();
                    const y = parseInt(clean.substring(0, 4)), m = parseInt(clean.substring(4, 6)) - 1, d = parseInt(clean.substring(6, 8));
                    
                    if (clean.includes('T')) {
                        const h = parseInt(clean.substring(9, 11));
                        const min = parseInt(clean.substring(11, 13));
                        const date = new Date(Date.UTC(y, m, d, h, min));
                        return date;
                    }
                    return new Date(y, m, d);
                };

                lines.forEach(line => {
                    if (line.startsWith('BEGIN:VEVENT')) currentEvent = { status: 'CONFIRMED' };
                    else if (line.startsWith('END:VEVENT')) {
                        if (currentEvent?.start) {
                            const key = currentEvent.start.toLocaleDateString('en-CA');
                            if (!events[key]) events[key] = [];
                            events[key].push(currentEvent);
                        }
                        currentEvent = null;
                    } else if (currentEvent) {
                        if (line.startsWith('DTSTART')) currentEvent.start = parseDate(line.split(':')[1]);
                        else if (line.startsWith('DTEND')) currentEvent.end = parseDate(line.split(':')[1]);
                        else if (line.startsWith('SUMMARY')) currentEvent.summary = line.substring(8);
                        else if (line.startsWith('UID')) currentEvent.uid = line.slice(line.indexOf(':') + 1).trim();
                    }
                });
                return events;
            };

            // Op file:// is fetch() geblokkeerd; herlaad schedule-data.js daarom als verse
            // <script>-tag (met cache-bust) zodat window.SCHEDULE_ICS de laatste sync van
            // rooster-sync.js bevat — ook als het dashboard al open staat.
            const herlaadScheduleData = () => new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = `schedule-data.js?t=${Date.now()}`;
                s.onload = () => { s.remove(); resolve(true); };
                s.onerror = () => { s.remove(); resolve(false); };
                document.head.appendChild(s);
            });

            const fetchAndParseICS = async () => {
                setLoadingShifts(true);
                try {
                    // Rooster laden. Lokaal (file://): uit window.SCHEDULE_ICS (schedule-data.js,
                    // gegenereerd door rooster-sync.js), eerst vers herladen van schijf. Anders
                    // (GitHub Pages): fetch ./schedule.ics, server-side ververst door de GitHub Action.
                    if (typeof window !== 'undefined' && window.SCHEDULE_ICS) await herlaadScheduleData();
                    let txt = (typeof window !== 'undefined' && window.SCHEDULE_ICS) ? window.SCHEDULE_ICS : "";
                    if (!txt.includes("BEGIN:VCALENDAR")) {
                        const res = await fetch(`./schedule.ics?t=${Date.now()}`, { cache: "no-store" });
                        if (res.ok) txt = await res.text();
                    }
                    if (!txt.includes("BEGIN:VCALENDAR")) throw new Error("Geen rooster gevonden (draai rooster-sync.js)");
                    const parsedShifts = parseICS(txt);
                    setRosterShifts(parsedShifts);

                    console.log("Auto-rooster laadt niet.");

            // Live verversen: haal het rooster opnieuw op zodra het dashboard weer op de

            useEffect(() => {
                const ververs = () => { if (document.visibilityState === 'visible') fetchAndParseICS(); };
                document.addEventListener('visibilitychange', ververs);
                window.addEventListener('focus', ververs);
                const id = setInterval(ververs, 5 * 60 * 1000);
                return () => {
                    document.removeEventListener('visibilitychange', ververs);
                    window.removeEventListener('focus', ververs);

            const formatTime = (d) => d ? d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) : "";

            // --- WEER (Open-Meteo, Weesp) — icoon + min/max temp per dag, ~16 dagen vooruit ---
            const weatherIcon = (code) => {
                if (code === 0) return '☀️';
                if (code === 1 || code === 2) return '🌤️';
                if (code === 3) return '☁️';
                if (code === 45 || code === 48) return '🌫️';
                if (code >= 51 && code <= 57) return '🌦️';
                if (code >= 61 && code <= 67) return '🌧️';
                if (code >= 71 && code <= 77) return '❄️';
                if (code >= 80 && code <= 82) return '🌦️';
                if (code >= 85 && code <= 86) return '🌨️';
                if (code >= 95) return '⛈️';
                return '🌡️';
            };
            const [weather, setWeather] = useState(() => {
                try {

                    if (c && (Date.now() - c.ts) < 3 * 60 * 60 * 1000) return c.data;

                return {};
            });
            useEffect(() => {
                try {

                    if (c && (Date.now() - c.ts) < 3 * 60 * 60 * 1000) return;
                } catch (e) {}
                const url = "https://api.open-meteo.com/v1/forecast?latitude=52.31&longitude=5.04&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe/Amsterdam&forecast_days=16";
                fetch(url).then(r => r.json()).then(d => {
                    if (!d || !d.daily) return;
                    const map = {};
                    d.daily.time.forEach((date, i) => {
                        // Dagen zonder (volledige) voorspelling overslaan — anders verschijnt er 0°/0°
                        if (d.daily.weather_code[i] == null || d.daily.temperature_2m_max[i] == null || d.daily.temperature_2m_min[i] == null) return;
                        map[date] = { code: d.daily.weather_code[i], max: Math.round(d.daily.temperature_2m_max[i]), min: Math.round(d.daily.temperature_2m_min[i]) };
                    });
                    setWeather(map);
                    try { localStorage.setItem('weather_cache', JSON.stringify({ ts: Date.now(), data: map })); } catch (e) {}
                }).catch(e => console.log('Weer laadt niet:', e.message));
            }, []);

            // Maanfase berekening - retourneert 🌑 (nieuwe maan) of 🌕 (volle maan) of null
            // Genereer alle maan datums van 2025-2050 bij eerste aanroep
            const moonDatesCache = (() => {
                const cache = {};
                // Bekende nieuwe maan: 29 januari 2025 12:36 UTC
                const knownNewMoon = Date.UTC(2025, 0, 29, 12, 36);
                const synodicMonth = 29.53058867 * 24 * 60 * 60 * 1000; // in milliseconden

                // Bereken alle nieuwe en volle manen van 2025-2050
                const startDate = new Date(2025, 0, 1).getTime();
                const endDate = new Date(2050, 11, 31).getTime();

                // Vind eerste nieuwe maan voor 2025
                let newMoonTime = knownNewMoon;
                while (newMoonTime > startDate) newMoonTime -= synodicMonth;
                while (newMoonTime < startDate) newMoonTime += synodicMonth;

                // Genereer alle nieuwe manen
                while (newMoonTime <= endDate) {
                    const d = new Date(newMoonTime);
                    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                    cache[key] = '🌑';
                    newMoonTime += synodicMonth;
                }

                // Genereer alle volle manen (halverwege tussen nieuwe manen)
                let fullMoonTime = knownNewMoon + (synodicMonth / 2);
                while (fullMoonTime > startDate) fullMoonTime -= synodicMonth;
                while (fullMoonTime < startDate) fullMoonTime += synodicMonth;

                while (fullMoonTime <= endDate) {
                    const d = new Date(fullMoonTime);
                    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                    cache[key] = '🌕';
                    fullMoonTime += synodicMonth;
                }

                return cache;
            })();

            const getMoonPhase = (date) => {
                const dateKey = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
                return moonDatesCache[dateKey] || null;
            };

            const handleAddNote = () => {
                if (!selectedDate) return;
                const updated = { ...manualShifts };
                if (newEntryType === 'vakantie') {
                    // Markeer een hele periode in één keer als vakantie (elke dag een eigen, los te verwijderen item)
                    const start = new Date(`${selectedDate}T12:00:00`);
                    const eindStr = vakantieTotEnMet || selectedDate;
                    let eind = new Date(`${eindStr}T12:00:00`);
                    if (isNaN(eind) || eind < start) eind = new Date(start);
                    const d = new Date(start);
                    let teller = 0;
                    while (d <= eind && teller < 62) {                    // veiligheidsgrens: max ~2 maanden per keer
                        const key = toLocalISOString(d);
                        if (!(updated[key] || []).some(isVakantieEntry)) {
                            updated[key] = [...(updated[key] || []), { id: Date.now() + teller, summary: 'Vakantie', isManual: true, isNote: true, isVakantie: true }];
                        }
                        d.setDate(d.getDate() + 1);
                        teller++;
                    }
                } else {
                    if (!newNote.trim()) return;
                    updated[selectedDate] = [...(updated[selectedDate] || []), {
                        id: Date.now(),
                        summary: newNote,
                        isManual: true,
                        isNote: true
                    }];
                }
                saveData(updated);
                setShowAddModal(false);
                setSelectedDate(null);
                setNewNote("");
                setNewEntryType('note');
                setVakantieTotEnMet("");
            };

            // --- AMBER ROOSTER FUNCTIES ---
            const amberMNames = ["Januari", "Februari", "Maart", "April", "Mei", "Juni", "Juli", "Augustus", "September", "Oktober", "November", "December"];

            const decodeAmberShift = (code) => {
                if (!code || code.length < 4) return null;
                const cleanCode = code.toUpperCase().trim();
                
                const shiftMap = {
                    'A080': { startTime: '07:00', endTime: '15:30', duration: 8.5 },
                    'A070': { startTime: '07:00', endTime: '14:30', duration: 7.5 },
                    'A040': { startTime: '07:00', endTime: '11:00', duration: 4 },
                    'B080': { startTime: '08:00', endTime: '16:30', duration: 8.5 },
                    'B070': { startTime: '08:00', endTime: '15:30', duration: 7.5 },
                    'B040': { startTime: '08:00', endTime: '12:00', duration: 4 },
                    'C080': { startTime: '09:00', endTime: '17:30', duration: 8.5 },
                    'C070': { startTime: '09:00', endTime: '16:30', duration: 7.5 },
                    'C040': { startTime: '09:00', endTime: '13:00', duration: 4 },
                    'H280': { startTime: '14:30', endTime: '23:00', duration: 8.5 },
                };
                
                return shiftMap[cleanCode] || null;
            };

            const parseAmberBulkInput = (input, month, year) => {
                const results = [];
                const pattern = /(\d{1,2})\s*[:\-\s]\s*([ABCH]\d{3})/gi;
                let match;
                
                while ((match = pattern.exec(input)) !== null) {
                    const day = parseInt(match[1]);
                    const code = match[2].toUpperCase();
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    
                    if (day < 1 || day > daysInMonth) continue;
                    
                    const decoded = decodeAmberShift(code);
                    if (decoded) {
                        const dateObj = new Date(year, month, day);
                        const dateKey = toLocalISOString(dateObj);
                        results.push({
                            day,
                            dateKey,
                            code,
                            decoded,
                            dateDisplay: dateObj.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' }),
                            selected: true
                        });
                    }
                }
                
                results.sort((a, b) => a.day - b.day);
                return results;
            };

            const handleAmberBulkParse = () => {
                const parsed = parseAmberBulkInput(amberBulkInput, amberMonth, amberYear);
                setAmberBulkParsed(parsed);
            };

            const toggleAmberBulkSelection = (index) => {
                setAmberBulkParsed(prev => prev.map((item, i) => 
                    i === index ? { ...item, selected: !item.selected } : item
                ));
            };

            const importAmberBulkShifts = () => {
                const selected = amberBulkParsed.filter(s => s.selected);
                if (selected.length === 0) return;

                const updated = { ...amberShifts };

                // Verwijder eerst alle bestaande shifts voor de geselecteerde maand
                const month = amberMonth;
                const year = amberYear;
                Object.keys(updated).forEach(dateKey => {
                    const d = new Date(dateKey);
                    if (d.getMonth() === month && d.getFullYear() === year) {
                        delete updated[dateKey];
                    }
                });

                // Voeg nieuwe shifts toe
                selected.forEach(entry => {
                    updated[entry.dateKey] = [{
                        id: Date.now() + Math.random(),
                        code: entry.code,
                        startTime: entry.decoded.startTime,
                        endTime: entry.decoded.endTime
                    }];
                });

                setAmberShifts(updated);
                closeAmberModal();
            };

            const analyzeAmberScreenshot = async (file) => {
                setAmberAnalyzing(true);
                setAmberAnalyzeError(null);
                
                try {
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => {
                            const base64 = reader.result.split(",")[1];
                            resolve(base64);
                        };
                        reader.onerror = () => reject(new Error("Kon bestand niet lezen"));
                        reader.readAsDataURL(file);
                    });
                    
                    const mediaType = file.type || 'image/png';
                    
                    const response = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            model: "claude-sonnet-4-20250514",
                            max_tokens: 1000,
                            messages: [
                                {
                                    role: "user",
                                    content: [
                                        {
                                            type: "image",
                                            source: {
                                                type: "base64",
                                                media_type: mediaType,
                                                data: base64Data,
                                            }
                                        },
                                        {
                                            type: "text",
                                            text: `Dit is een screenshot van een werkrooster. Analyseer de afbeelding en extract alle werkdagen met hun codes.

De codes bestaan uit:
- Een letter (A, B of C) voor de starttijd
- Een getal (040, 070 of 080) voor de duur

Voorbeelden: A080, B070, C040

Geef ALLEEN de data terug in dit exacte formaat, niets anders:
dag:code, dag:code, dag:code

Bijvoorbeeld: 2:C040, 3:B070, 5:B070, 6:A080

Als je geen rooster of codes kunt vinden, antwoord dan alleen: GEEN_DATA`
                                        }
                                    ]
                                }
                            ]
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`API fout: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    const result = data.content[0].text.trim();
                    
                    if (result === "GEEN_DATA" || result.length < 3) {
                        setAmberAnalyzeError("Geen rooster gevonden in de afbeelding.");
                        return;
                    }
                    
                    setAmberBulkInput(result);
                    const parsed = parseAmberBulkInput(result, amberMonth, amberYear);
                    if (parsed.length > 0) {
                        setAmberBulkParsed(parsed);
                    } else {
                        setAmberAnalyzeError("Kon de gevonden data niet verwerken.");
                    }
                    
                } catch (err) {
                    // Geef duidelijkere foutmelding
                    if (err.message.includes("fetch") || err.message.includes("network")) {
                        setAmberAnalyzeError("AI analyse werkt alleen binnen Claude. Stuur de screenshot naar Claude in de chat en plak de code hieronder.");
                    } else {
                        setAmberAnalyzeError("Fout: " + err.message);
                    }
                } finally {
                    setAmberAnalyzing(false);
                }
            };

            const handleAmberScreenshotUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                analyzeAmberScreenshot(file);
            };

            const openAmberModal = () => {
                setAmberMonth(viewDate.getMonth());
                setAmberYear(viewDate.getFullYear());
                setAmberBulkInput("");
                setAmberBulkParsed([]);
                setAmberAnalyzeError(null);
                setShowAmberModal(true);
            };

            const closeAmberModal = () => {
                setShowAmberModal(false);
                setAmberBulkInput("");
                setAmberBulkParsed([]);
                setAmberAnalyzeError(null);
            };

            const deleteAmberShift = (dateKey) => {
                const updated = { ...amberShifts };
                delete updated[dateKey];
                setAmberShifts(updated);
            };

            const toggleFilter = (filterName) => {
                setCalendarFilters(prev => ({
                    ...prev,
                    [filterName]: !prev[filterName]
                }));
            };
            
            const filterRosterShifts = (shifts) => {
                if (!shifts || shifts.length === 0) return [];
                const sorted = [...shifts].sort((a, b) => a.start - b.start);
                
                return sorted.reduce((acc, cur) => {
                    const s = cur.summary?.toLowerCase() || "";
                    if (s.includes("roostervrij")) return acc; 
                    
                    if (acc.length > 0) {
                        const last = acc[acc.length - 1];
                        if (cur.start < new Date(last.end.getTime() - 60000)) {
                            acc[acc.length - 1] = cur;
                        } else {
                            acc.push(cur);
                        }
                    } else {
                        acc.push(cur);
                    }
                    return acc;
                }, []);
            };

            const isSwimTimeConflict = (swimTimeStr, shifts, currentDayDate) => {
                if (!shifts || shifts.length === 0) return false;
                
                const [startStr, endStr] = swimTimeStr.split(' - ').map(s => s.replace(' uur', '').trim());
                const [startH, startM] = startStr.split(/[:.]/).map(Number);
                const [endH, endM] = endStr.split(/[:.]/).map(Number);
                
                const swimStart = new Date(currentDayDate);
                swimStart.setHours(startH, startM, 0, 0);
                const swimEnd = new Date(currentDayDate);
                swimEnd.setHours(endH, endM, 0, 0);
                
                return shifts.some(shift => {
                    if (shift.isNote) return false; 
                    if (shift.summary?.toLowerCase().includes('verlof')) return false;
                    return (swimStart < shift.sortEnd && swimEnd > shift.sortStart);
                });
            };

            const nextM = () => { const n = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1); if(n.getFullYear()<=2027) setViewDate(n); };
            const prevM = () => { const p = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1); if(p>=new Date('2025-10-01')) setViewDate(p); };
            const mNames = ["Januari", "Februari", "Maart", "April", "Mei", "Juni", "Juli", "Augustus", "September", "Oktober", "November", "December"];

            const renderCalendar = () => {
                const year = viewDate.getFullYear();
                const month = viewDate.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDay = new Date(year, month, 1).getDay() === 0 ? 6 : new Date(year, month, 1).getDay() - 1;
                const days = [];
                
                for (let i = 0; i < firstDay; i++) days.push(<div key={`e-${i}`} className="h-36 bg-slate-100/80 border border-slate-100"></div>);

                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(year, month, day);
                    const dateKey = toLocalISOString(date);
                    const dayOfWeek = date.getDay();
                    
                    // SOBRIETY HISTORY CHECK (met filter)
                    const daySoberCount = calendarFilters.showSobriety ? getDaySoberCount(date) : 0;
                    
                    // ARM TRAINING HISTORY CHECK (met filter)
                    const isArmDay = calendarFilters.showTraining ? isArmTrainingDay(date) : false;

                    // AMBER SHIFT CHECK (met filter)
                    const amberShift = calendarFilters.showAmber ? amberShifts[dateKey]?.[0] : null;

                    // SALARY DAY CHECK (met filter)
                    const salaryDay = calendarFilters.showSalary ? salaryDays[dateKey] : null;

                    // TRIGION DAY CHECK (met filter)
                    const trigionDay = calendarFilters.showTrigion ? trigionDays[dateKey] : null;

                    // VAKANTIE CHECK (eigen dagtype met eigen kleur, los van het Werk-filter)
                    const vakantieEntries = calendarFilters.showVakantie ? (manualShifts[dateKey] || []).filter(isVakantieEntry) : [];
                    const isVakantieDag = vakantieEntries.length > 0;

                    // Pas handmatige correcties toe: verborgen diensten eruit, aangepaste tijden/omschrijving erin.
                    const rosterRaw = (rosterShifts[dateKey] || [])
                        .map(s => {
                            const ov = s.uid ? rosterOverrides[s.uid] : null;
                            if (!ov) return s;
                            if (ov.hidden) return null;
                            const m = { ...s, edited: true };
                            if (ov.summary !== undefined) m.summary = ov.summary;
                            if (ov.startISO) m.start = new Date(ov.startISO);
                            if (ov.endISO) m.end = new Date(ov.endISO);
                            return m;
                        })
                        .filter(Boolean);
                    const finalRoster = calendarFilters.showWork ? filterRosterShifts(rosterRaw).map(s => ({
                        ...s, type: 'roster', sortStart: s.start, sortEnd: s.end
                    })) : [];

                    // Check of er een echte Roster dienst is (niet alleen verlof)
                    const hasRealRosterShift = finalRoster.length > 0;

                    const manualDay = calendarFilters.showWork ? (manualShifts[dateKey] || [])
                        // Historische G4S-import verbergen als het rooster die dag al dekt
                        .filter(s => {
                            if (s.isG4SShift && hasRealRosterShift) {
                                return false;
                            }
                            if (isVakantieEntry(s)) {
                                return false;      // vakantie rendert als eigen dagtype, niet als notitie
                            }
                            if (s.isNote && !calendarFilters.showNotes) {
                                return false;
                            }
                            return true;
                        })
                        .map(s => {
                        let start = new Date(date);
                        let end = new Date(date);
                        if (s.isNote || s.isG4SShift) {
                            start.setHours(0, 0);
                            end.setHours(23, 59);
                        } else if (s.startTime) {
                            const [h1, m1] = s.startTime.split(':').map(Number);
                            const [h2, m2] = s.endTime.split(':').map(Number);
                            start.setHours(h1, m1);
                            end.setHours(h2, m2);
                        }
                        return { ...s, type: 'manual', sortStart: start, sortEnd: end };
                    }) : [];

                    const swimInfo = poolSchedule[dayOfWeek];
                    const swimEvents = [];
                    if (swimInfo.isOpen && calendarFilters.showSwimming) {
                        swimInfo.times.forEach(tStr => {
                            const allWorkShifts = [...finalRoster, ...manualDay];
                            if (!isSwimTimeConflict(tStr, allWorkShifts, date)) {
                                const [startStr, endStr] = tStr.split(' - ');
                                const [h1, m1] = startStr.split(/[:.]/).map(Number);
                                const [h2, m2] = endStr.split(/[:.]/).map(Number);
                                const start = new Date(date); start.setHours(h1, m1);
                                const end = new Date(date); end.setHours(h2, m2);
                                swimEvents.push({ type: 'swim', summary: tStr, sortStart: start, sortEnd: end });
                            }
                        });
                    }

                    const allEvents = [...finalRoster, ...manualDay, ...swimEvents].sort((a, b) => {
                        // Notities altijd bovenaan
                        if (a.isNote && !b.isNote) return -1;
                        if (!a.isNote && b.isNote) return 1;
                        // Daarna op tijd sorteren
                        return a.sortStart - b.sortStart;
                    });
                    const isToday = currentDate.toDateString() === date.toDateString();
                    
                    // Check voor werk: Roster diensten, handmatige shifts of historische G4S-import
                    const hasWork = allEvents.some(e => (e.type === 'roster' || (e.type === 'manual' && !e.isNote))) ||
                                   (manualShifts[dateKey] || []).some(s => s.isG4SShift);
                    const isOnlyVerlof = hasWork && allEvents.every(e => e.type !== 'swim' && e.summary?.toLowerCase().includes('verlof'));

                    // Kleurcode: groen = vrij, rood = werken, oranje = vakantie, blauw = vandaag
                    let bgClass = "bg-gradient-to-br from-emerald-50 to-teal-100/70 border-emerald-200";
                    if (isVakantieDag) bgClass = "bg-gradient-to-br from-amber-100 via-orange-100 to-yellow-100 border-orange-300";
                    if (hasWork && !isOnlyVerlof) bgClass = "bg-gradient-to-br from-red-50 to-rose-100/80 border-red-200";
                    if (isToday) bgClass = "bg-gradient-to-br from-sky-100 to-indigo-100 ring-2 ring-blue-500 shadow-[0_0_18px_rgba(59,130,246,0.45)] z-10";

                    days.push(
                        <div key={day} className={`h-36 border p-1 relative flex flex-col ${bgClass} group transition-colors`}>
                            <div className="flex justify-between items-start mb-1">
                                <span className={`text-sm font-bold font-display ${isToday ? 'text-blue-600' : (hasWork && !isOnlyVerlof ? 'text-red-700' : (isVakantieDag ? 'text-orange-600' : 'text-emerald-700'))}`}>{day}{getMoonPhase(date) && <span className="ml-1 text-xs" title={getMoonPhase(date) === '🌑' ? 'Nieuwe maan' : 'Volle maan'}>{getMoonPhase(date)}</span>}</span>
                                {isToday && <span className="hidden sm:inline-block text-[10px] bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-1.5 py-0.5 rounded-full font-bold shadow">Vandaag</span>}
                                <button onClick={() => { setSelectedDate(dateKey); setNewNote(""); setNewEntryType('note'); setVakantieTotEnMet(dateKey); setShowAddModal(true); }} className="touch-zichtbaar opacity-30 group-hover:opacity-100 text-blue-600 p-1 -m-0.5 hover:bg-white/60 rounded transition-opacity"><Plus size={15}/></button>
                            </div>
                            
                            {weather[dateKey] && (
                                <div className="text-[9px] font-semibold text-sky-700 flex items-center gap-1 mb-0.5 px-0.5 whitespace-nowrap" title="Weersvoorspelling Weesp">
                                    <span className="text-[11px] leading-none">{weatherIcon(weather[dateKey].code)}</span>
                                    <span className="hidden sm:inline">{weather[dateKey].max}° / {weather[dateKey].min}°</span>
                                    <span className="sm:hidden">{weather[dateKey].max}°</span>
                                </div>
                            )}
                            <div className="flex-1 flex flex-col gap-1 overflow-y-auto custom-scrollbar">
                                {/* 0. VAKANTIE (eigen dagtype, oranje) */}
                                {vakantieEntries.map((e) => (
                                    <div key={`v-${e.id}`} className="text-[10px] font-bold p-1 rounded-lg mb-0.5 flex justify-between items-center group/item bg-gradient-to-r from-orange-400 to-amber-400 text-white shadow-sm w-full text-left">
                                        <span className="flex items-center gap-1 leading-tight"><Palmtree size={11} className="shrink-0"/> <span className="hidden sm:inline">Vakantie</span></span>
                                        <button onClick={(ev)=>{ev.stopPropagation(); if (window.confirm('Deze vakantiedag verwijderen?')) handleDeleteShift(dateKey, e.id);}} className="touch-zichtbaar opacity-0 group-hover/item:opacity-100 text-white/80 hover:text-white ml-1 shrink-0"><Trash2 size={10}/></button>
                                    </div>
                                ))}

                                {/* 1. NOTITIES EERST */}
                                {allEvents.filter(e => e.isNote).map((e) => (
                                    <div key={`m-${e.id}`} className="text-[10px] font-bold p-1 rounded-lg border border-slate-200 mb-0.5 flex justify-between items-start group/item bg-white shadow-sm text-slate-800 w-full text-left">
                                        <span className="break-words w-full leading-tight">{e.summary}</span>
                                        <button onClick={(ev)=>{ev.stopPropagation(); handleDeleteShift(dateKey, e.id)}} className="touch-zichtbaar opacity-0 group-hover/item:opacity-100 text-gray-400 hover:text-red-500 ml-1 shrink-0"><Trash2 size={10}/></button>
                                    </div>
                                ))}

                                {/* 2. AMBER'S SHIFT */}
                                {amberShift && (
                                    <div className="flex items-center justify-between text-[9px] text-pink-700 bg-pink-50 p-0.5 rounded border border-pink-200 w-full group/amber">
                                        <div className="flex items-center">
                                            <Heart size={10} className="mr-1 fill-pink-300"/>
                                            <span className="font-medium">Amber {amberShift.startTime}-{amberShift.endTime}</span>
                                        </div>
                                        <button onClick={(ev) => { ev.stopPropagation(); deleteAmberShift(dateKey); }} className="touch-zichtbaar opacity-0 group-hover/amber:opacity-100 text-pink-500 hover:text-pink-700"><Trash2 size={10}/></button>
                                    </div>
                                )}

                                {/* 2.5 SALARISDAG */}
                                {salaryDay && (
                                    <div className="flex items-center text-[9px] text-yellow-800 bg-yellow-100 p-0.5 rounded border border-yellow-300 w-full font-bold">
                                        <span className="mr-1">💰</span>
                                        <span>G4S P{salaryDay.periode}{salaryDay.note ? ` (${salaryDay.note})` : ''}</span>
                                    </div>
                                )}

                                {/* 2.6 TRIGION BETAALDAG */}
                                {trigionDay && (
                                    <div className="flex items-center text-[9px] text-yellow-800 bg-yellow-100 p-0.5 rounded border border-yellow-300 w-full font-bold">
                                        <span className="mr-1">💰</span>
                                        <span>Trigion P{trigionDay.periode}</span>
                                    </div>
                                )}

                                {/* 3. REST VAN DE EVENTS (geen notities) */}
                                {allEvents.filter(e => !e.isNote).map((e, idx) => {
                                    if (e.type === 'swim') {
                                        return (
                                            <div key={`s-${idx}`} className="flex flex-col items-start text-[9px] text-blue-700 bg-white/80 p-1 rounded border border-blue-100 mb-0.5 w-full text-left shadow-sm">
                                                <div className="flex items-center font-bold mb-0.5"><Droplets size={8} className="mr-1"/> <span>Zwemmen</span></div>
                                                <span className="font-medium block">{e.summary}</span>
                                            </div>
                                        );
                                    }
                                    if (e.type === 'roster') {
                                        const isVerlof = e.summary?.toLowerCase().includes('verlof');
                                        const txt = cleanSummary(e.summary);
                                        return (
                                            <div key={`o-${idx}`} className="text-[9px] p-1 rounded bg-white shadow-sm text-purple-800 border border-purple-200 mb-0.5 w-full text-left group/shift relative">
                                                <div className="font-bold flex items-center justify-between gap-1">
                                                    <span className="flex items-center min-w-0"><Briefcase size={8} className="mr-1 shrink-0"/> <span className="truncate">{isVerlof ? "Verlof" : `${formatTime(e.sortStart)} - ${formatTime(e.sortEnd)}`}</span></span>
                                                    {e.uid && (
                                                        <span className="touch-zichtbaar flex items-center gap-1 shrink-0 opacity-0 group-hover/shift:opacity-100 transition-opacity">
                                                            <button onClick={(ev)=>{ev.stopPropagation(); openEditShift(dateKey, e);}} className="text-gray-400 hover:text-blue-600" title="Dienst aanpassen"><Pencil size={10}/></button>
                                                            <button onClick={(ev)=>{ev.stopPropagation(); handleHideRosterShift(e.uid);}} className="text-gray-400 hover:text-red-600" title="Dienst verwijderen"><Trash2 size={10}/></button>
                                                        </span>
                                                    )}
                                                </div>
                                                {!isVerlof && txt && <div className="truncate opacity-80">{txt}</div>}
                                                {e.edited && <div className="text-[8px] text-blue-600 italic flex items-center gap-0.5"><Pencil size={7}/> aangepast</div>}
                                            </div>
                                        );
                                    }
                                    if (e.type === 'manual') {
                                        // Historische G4S-import heeft geen aparte tijdvelden; de tijden staan in de summary.
                                        return (
                                            <div key={`m-${e.id}`} className="text-[9px] p-1 rounded border mb-0.5 flex justify-between items-center group/item bg-white shadow-sm text-orange-800 border-orange-200 w-full text-left">
                                                <div className="overflow-hidden w-full">
                                                    {e.startTime && <div className="font-bold">{e.startTime} - {e.endTime}</div>}
                                                    <div className="truncate opacity-80">{e.summary}</div>
                                                </div>
                                                <button onClick={(ev)=>{ev.stopPropagation(); handleDeleteShift(dateKey, e.id)}} className="touch-zichtbaar opacity-0 group-hover/item:opacity-100 text-red-500 ml-1 shrink-0"><Trash2 size={10}/></button>
                                            </div>
                                        );
                                    }
                                    return null;
                                })}
                                
                                {/* 4. TRACKING INDICATORS ONDERAAN */}
                                {daySoberCount > 0 && <div className={`flex items-center text-[9px] ${currentDate.toDateString() === date.toDateString() ? "text-white bg-green-600 border-green-600 font-bold" : "text-green-700 bg-white/50 border-green-100"} p-0.5 rounded border w-full mt-auto transition-colors`}><CheckCircle size={10} className="mr-1"/> Dag {daySoberCount}</div>}
                                {isArmDay && <div className="flex items-center text-[9px] text-red-700 font-bold bg-white/50 p-0.5 rounded border border-red-100 w-full"><Activity size={10} className="mr-1"/> Armen</div>}
                            </div>
                        </div>
                    );
                }
                // Laatste rij aanvullen met lege cellen, zodat er geen kale strook overblijft
                const rest = (7 - ((firstDay + daysInMonth) % 7)) % 7;
                for (let i = 0; i < rest; i++) days.push(<div key={`t-${i}`} className="h-36 bg-slate-100/80 border border-slate-100"></div>);
                return days;
            };

            // Trigion-loonperiodes: 13 periodes van 4 weken (ma t/m zo), gekoppeld aan ISO-kalenderweken.
            // Periode N = week (4N−3) t/m week 4N; in een jaar met 53 weken duurt periode 13 vijf weken.
            const isoWeekInfo = (d) => {
                const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                const dag = (date.getDay() + 6) % 7; // ma=0 ... zo=6
                date.setDate(date.getDate() - dag + 3); // donderdag van deze week bepaalt het ISO-jaar
                const isoYear = date.getFullYear();
                const jan4 = new Date(isoYear, 0, 4);
                const week = 1 + Math.round(((date - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
                return { isoYear, week };
            };
            const maandagVanWeek = (isoYear, week) => {
                const jan4 = new Date(isoYear, 0, 4);
                const ma = new Date(jan4);
                ma.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7) + (week - 1) * 7);
                return ma;
            };
            const wekenInIsoJaar = (isoYear) => isoWeekInfo(new Date(isoYear, 11, 28)).week; // 28 dec valt altijd in de laatste ISO-week
            const periodeInfo = (dateKey) => {
                const { isoYear, week } = isoWeekInfo(new Date(`${dateKey}T12:00:00`));
                const nr = Math.min(13, Math.ceil(week / 4));
                const eindWeek = nr === 13 ? wekenInIsoJaar(isoYear) : nr * 4;
                const start = maandagVanWeek(isoYear, nr * 4 - 3);
                const eind = maandagVanWeek(isoYear, eindWeek);
                eind.setDate(eind.getDate() + 6); // zondag
                return { key: `${isoYear}-P${String(nr).padStart(2, '0')}`, nr, isoYear, start, eind };
            };

            // Verzamelt alle GEWERKTE diensten (automatisch rooster + handmatige G4S-import) voor de
            // urenadministratie. Past correcties toe, laat verlof/roostervrij weg, ontdubbelt per dag
            // (automatische dienst wint van handmatige), en berekent de uren.
            const buildWorkLog = () => {
                const urenTussen = (start, end) => Math.max(0, (end - start) / 3600000);
                const parseHM = (str) => {
                    const m = (str || "").match(/(\d{1,2})[:.](\d{2})\s*[-–]\s*(\d{1,2})[:.](\d{2})/);
                    return m ? { sh:+m[1], sm:+m[2], eh:+m[3], em:+m[4] } : null;
                };
                const byDate = {};
                // 1) Automatisch rooster (na correcties), zonder verlof.
                Object.keys(rosterShifts).forEach(dateKey => {
                    const raw = (rosterShifts[dateKey] || []).map(s => {
                        const ov = s.uid ? rosterOverrides[s.uid] : null;
                        if (!ov) return s;
                        if (ov.hidden) return null;
                        const m = { ...s, edited: true };
                        if (ov.summary !== undefined) m.summary = ov.summary;
                        if (ov.startISO) m.start = new Date(ov.startISO);
                        if (ov.endISO) m.end = new Date(ov.endISO);
                        return m;
                    }).filter(Boolean);
                    filterRosterShifts(raw).forEach(s => {
                        if (!s.start || !s.end) return;
                        if (s.summary?.toLowerCase().includes('verlof')) return;
                        (byDate[dateKey] = byDate[dateKey] || []).push({
                            dateKey, begin: formatTime(s.start), eind: formatTime(s.end),
                            uren: urenTussen(s.start, s.end),
                            omschrijving: cleanSummary(s.summary) || 'Dienst',
                            bron: s.edited ? 'Rooster (aangepast)' : 'Rooster',
                        });
                    });
                });
                // 2) Handmatig geïmporteerde G4S-diensten — alleen op dagen zonder automatische dienst.
                Object.keys(manualShifts).forEach(dateKey => {
                    if (byDate[dateKey] && byDate[dateKey].length) return;
                    (manualShifts[dateKey] || []).forEach(s => {
                        if (s.isNote || !s.isG4SShift) return;
                        const hm = parseHM(s.summary);
                        let uren = 0, begin = '', eind = '';
                        if (hm) {
                            const start = new Date(`${dateKey}T00:00:00`); start.setHours(hm.sh, hm.sm);
                            let end = new Date(`${dateKey}T00:00:00`); end.setHours(hm.eh, hm.em);
                            if (end <= start) end = new Date(end.getTime() + 24*3600*1000);
                            uren = urenTussen(start, end); begin = formatTime(start); eind = formatTime(end);
                        }
                        (byDate[dateKey] = byDate[dateKey] || []).push({ dateKey, begin, eind, uren, omschrijving: 'Dienst', bron: 'Handmatig' });
                    });
                });
                const nu = new Date();
                const vandaagKey = `${nu.getFullYear()}-${String(nu.getMonth()+1).padStart(2,'0')}-${String(nu.getDate()).padStart(2,'0')}`;
                const entries = Object.values(byDate).flat()
                    .filter(e => e.dateKey <= vandaagKey) // alleen gewerkte diensten t/m vandaag, geen geplande
                    .filter(e => periodeInfo(e.dateKey).isoYear >= 2026) // alleen periodes vanaf 2026
                    .sort((a,b) => a.dateKey < b.dateKey ? -1 : a.dateKey > b.dateKey ? 1 : 0);
                // Onbetaalde pauze per dienst (niet per dag: twee losse diensten op één dag worden
                // elk apart beoordeeld). Recht op pauze vanaf een dienst langer dan 5,5 uur (cao
                // Particuliere Beveiliging art. 29). Op Schiphol worden de kleine pauzes doorbetaald;
                // alleen de grote pauze van 30 minuten is onbetaald.
                const pauzeVoorDienst = (uren) => uren > 5.5 ? 0.5 : 0;
                entries.forEach(e => { e.pauze = pauzeVoorDienst(e.uren); e.netto = e.uren - e.pauze; });
                const periodes = {};
                entries.forEach(e => {
                    const p = periodeInfo(e.dateKey);
                    (periodes[p.key] = periodes[p.key] || { ...p, entries: [], totaal: 0 });
                    periodes[p.key].entries.push(e); periodes[p.key].totaal += e.netto;
                });
                return {
                    periodeGroepen: Object.values(periodes).sort((a,b)=> a.key < b.key ? -1 : 1),
                    totaalUren: entries.reduce((s,e)=>s+e.netto, 0),
                    aantal: entries.length,
                };
            };
            const exportWorkLogCSV = () => {
                const { periodeGroepen } = buildWorkLog();
                const nf = (n) => n.toFixed(2).replace('.', ',');
                const df = (k) => { const [y,m,d] = k.split('-'); return `${d}-${m}-${y}`; };
                const dd = (d) => `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
                const dagNamen = ['zo','ma','di','wo','do','vr','za'];
                const rows = [['Datum','Dag','Begin','Eind','Bruto','Pauze','Uren','Omschrijving','Bron']];
                periodeGroepen.forEach(g => {
                    g.entries.forEach(e => rows.push([df(e.dateKey), dagNamen[new Date(`${e.dateKey}T12:00:00`).getDay()], e.begin, e.eind, nf(e.uren), nf(e.pauze), nf(e.netto), e.omschrijving, e.bron]));
                    rows.push(['', '', '', '', '', `Totaal periode ${g.nr}-${g.isoYear} (${dd(g.start)} t/m ${dd(g.eind)})`, nf(g.totaal), '', '']);
                });
                const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'gewerkte_uren.csv';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            return (
                <div className="max-w-6xl mx-auto p-4 sm:p-6 font-sans min-h-screen relative">
                    <div className="aurora-vast" aria-hidden="true"></div>
                    <div className="glass rounded-2xl p-6 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 verschijn">
                        <div className="text-center sm:text-left">
                            <h1 className="font-display text-3xl font-bold bg-gradient-to-r from-cyan-300 via-violet-300 to-fuchsia-300 bg-clip-text text-transparent drop-shadow-[0_0_20px_rgba(168,85,247,0.35)]">Mijn Herstel Dashboard</h1>
                            <p className="text-slate-300 text-sm mt-1">Notities & automatisch rooster</p>
                        </div>
                        <div className="flex items-center gap-2 flex-wrap justify-center">
                            {/* FILTER KNOP */}
                            <button onClick={() => setShowFilters(!showFilters)} className={`flex items-center text-xs px-4 py-2 rounded-full font-bold transition-all shadow-lg ${showFilters ? 'bg-gradient-to-r from-fuchsia-500 to-purple-600 text-white shadow-fuchsia-500/40' : 'bg-white/10 text-fuchsia-200 border border-white/15 hover:bg-white/20'}`}>
                                <Filter size={14} className="mr-1.5"/> Filters
                            </button>
                            {/* ADMINISTRATIE / GEWERKTE UREN */}
                            <button onClick={() => setShowAdminModal(true)} className="flex items-center text-xs px-4 py-2 rounded-full font-bold transition-all bg-gradient-to-r from-indigo-500 to-cyan-500 text-white shadow-lg shadow-indigo-500/40 hover:brightness-110">
                                <Briefcase size={14} className="mr-1.5"/> Administratie
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
                        {/* LOONSTROOK KPI */}
                        <div className="glass kpi-card p-5 rounded-2xl flex flex-col items-center text-center verschijn" style={{animationDelay:'0.05s'}}>
                            <span className="absolute inset-x-0 top-0 h-1 rounded-t-2xl bg-gradient-to-r from-emerald-400 to-teal-400"></span>

        // De cloud-sync (deel 2/2, onderaan dit bestand) is nu de bron van waarheid en haalt de
        // gegevens automatisch op — zonder wachtwoord. Het oude versleutelde seed-pad met
        // wachtwoordprompt is daarom volledig verwijderd.
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
