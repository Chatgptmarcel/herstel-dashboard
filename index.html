    <!-- CLOUD-SYNC (2/2): verbindt stil met Firebase (anoniem, geen wachtwoord) en houdt de gegevens
         automatisch gelijk tussen pc en telefoon. Alleen window.SYNC_KEYS gaan de cloud in; verder
         verlaat er niets dit apparaat. Lukt verbinden niet, dan werkt het dashboard gewoon lokaal door. -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
        import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyC4AQN0cBfPt-sxvn2pxH5Y7zy6ZB37OUY",
            authDomain: "herstel-dashboard-sync.firebaseapp.com",
            projectId: "herstel-dashboard-sync",
            storageBucket: "herstel-dashboard-sync.firebasestorage.app",
            messagingSenderId: "922117230871",
            appId: "1:922117230871:web:bc1ea59e634099837de752"
        };

        const KEYS = window.SYNC_KEYS;
        const CLIENT_ID = localStorage.getItem('_sync_client_id') || ('c-' + Date.now());

        const readLocal = () => {
            const out = {};
            for (const k of KEYS) { const v = localStorage.getItem(k); if (v !== null) out[k] = v; }
            return out;
        };
        const stable = (obj) => JSON.stringify(obj, Object.keys(obj).sort());
        const hasLocalData = () => {
            for (const k of KEYS) { if (localStorage.getItem(k) !== null) return true; }
            return false;
        };
        // Alleen bij de allereerste sync: notities samenvoegen op id per datum, zodat niets verloren gaat.
        const mergeShifts = (localStr, remoteStr) => {
            let L = {}, R = {};
            try { L = JSON.parse(localStr || '{}'); } catch (e) {}
            try { R = JSON.parse(remoteStr || '{}'); } catch (e) {}
            const out = {};
            for (const date of new Set([...Object.keys(L), ...Object.keys(R)])) {
                const seen = new Set(); const arr = [];
                for (const e of [...(R[date] || []), ...(L[date] || [])]) {
                    const id = (e && e.id != null) ? e.id : JSON.stringify(e);
                    if (!seen.has(id)) { seen.add(id); arr.push(e); }
                }
                out[date] = arr;
            }
            return JSON.stringify(out);
        };

        let reloading = false;
        // Cloud-waarden lokaal toepassen en herladen, zodat de app ze oppakt.
        const applyRemote = (values, remoteTs, forcePush) => {
            window.__applyingRemote = true;
            for (const k of KEYS) { if (values[k] != null) localStorage.setItem(k, values[k]); }
            localStorage.setItem('_sync_ts', String(remoteTs || Date.now()));
            localStorage.setItem('_sync_pushed_hash', stable(readLocal()));
            localStorage.setItem('_seed_json_geladen', '1');
            if (forcePush) localStorage.setItem('_sync_force_push', '1');
            window.__applyingRemote = false;
            window.__reloading = true;   // vanaf nu geen pushes meer tot de herlaad de pagina vervangt
            reloading = true;
            location.reload();
        };

        (async function start() {
            let ref;
            try {
                const app = initializeApp(firebaseConfig);
                await signInAnonymously(getAuth(app));
                ref = doc(getFirestore(app), 'sync', 'dashboard');
            } catch (e) { console.warn('[sync] verbinden mislukt, dashboard werkt lokaal door:', e); return; }

            let lastPushed = localStorage.getItem('_sync_pushed_hash');
            let firstSnapshotDone = false;   // we hebben de cloud-staat nog niet gezien
            let timer = null;

            const push = async (attempt) => {
                if (reloading || window.__reloading) return;
                // Nooit pushen vóór we de cloud-staat kennen: anders kan een vers apparaat met
                // standaardwaarden (vandaag) de echte teldatums in de cloud overschrijven.
                if (!firstSnapshotDone) { window.__syncPending = true; return; }
                const values = readLocal();
                const s = stable(values);
                if (s === lastPushed) return;          // niets veranderd sinds vorige upload
                const ts = Date.now();
                try {
                    await setDoc(ref, { values, updatedAt: ts, updatedBy: CLIENT_ID });
                    lastPushed = s;
                    localStorage.setItem('_sync_pushed_hash', s);
                    localStorage.setItem('_sync_ts', String(ts));
                } catch (e) {
                    console.warn('[sync] uploaden mislukt, opnieuw proberen:', e);
                    const n = (attempt || 0) + 1;
                    if (n <= 3) setTimeout(() => push(n), n * 2500);   // 2.5s, 5s, 7.5s
                }
            };
            window.__syncRequestPush = () => { clearTimeout(timer); timer = setTimeout(() => push(0), 800); };

            // Wijzigingen die vóór deze module klaar was plaatsvonden alsnog meenemen.
            const flushPending = () => {
                if (window.__syncPending) { window.__syncPending = false; window.__syncRequestPush(); }
            };

            // Een eerder samengevoegd resultaat (na herlaad) alsnog uploaden zodra de cloud-staat bekend is.
            if (localStorage.getItem('_sync_force_push')) {
                localStorage.removeItem('_sync_force_push');
                lastPushed = null;
                window.__syncPending = true;
            }

            onSnapshot(ref, (snap) => {
                if (reloading) return;
                firstSnapshotDone = true;                            // vanaf nu kennen we de cloud-staat
                let willReload = false;
                try {
                    const data = snap.exists() ? snap.data() : null;
                    const neverSynced = !localStorage.getItem('_sync_ts');
                    const localTs = Number(localStorage.getItem('_sync_ts') || '0');

                    if (!data) {                                     // cloud nog leeg: dit apparaat zet de data neer
                        if (hasLocalData()) push(0);
                    } else if (data.updatedBy === CLIENT_ID) {       // onze eigen wijziging: negeren
                        lastPushed = stable(readLocal());
                        localStorage.setItem('_sync_pushed_hash', lastPushed);
                    } else {
                        const remoteTs = Number(data.updatedAt || 0);
                        const values = data.values || {};
                        if (neverSynced) {
                            if (hasLocalData()) {
                                // Eerste sync terwijl beide kanten data hebben: notities samenvoegen (geen verlies).
                                const merged = { ...values };
                                merged['dashboard_manual_shifts'] = mergeShifts(
                                    localStorage.getItem('dashboard_manual_shifts'), values['dashboard_manual_shifts']);
                                willReload = true; applyRemote(merged, remoteTs, true);
                            } else {
                                willReload = true; applyRemote(values, remoteTs, false); // vers apparaat: cloud overnemen
                            }
                        } else if (remoteTs > localTs) {             // cloud is nieuwer dan wat wij hebben
                            if (stable(readLocal()) !== stable(values)) { willReload = true; applyRemote(values, remoteTs, false); }
                            else localStorage.setItem('_sync_ts', String(remoteTs));
                        }
                    }
                } finally {
                    if (!willReload && !reloading) flushPending();
                }
            }, (err) => console.warn('[sync] luisteren mislukt:', err));
        })();
    </script>
